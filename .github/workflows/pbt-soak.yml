name: Property Soak

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pbt-soak.yml"
      - "hscontrol/**/*.go"
      - "tools/pbt-soak.sh"

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The property layer's deep runs, which the everyday suites do not make:
# the smoke job proves the soak runner and every property's deep invocation
# still work, in a bounded pass over each slot once; the nightly job rotates
# the properties at their deep budgets for about an hour and fails with the
# logs needed to reproduce anything that failed. A schedule fires only on
# the default branch, so the nightly starts once this branch is it; the
# smoke runs on every pull request that touches what it covers.
# See tools/pbt-soak.sh and hscontrol/policy/policymodel/README.md.
defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: smoke pass over every deep invocation
        run: PBT_SOAK_SMOKE=1 tools/pbt-soak.sh .

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: rotate the properties at their deep budgets for an hour
        run: tools/pbt-soak.sh . 1 3
      - name: upload what reproduces a failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: soak-${{ github.run_id }}
          path: |
            pbt-soak/commit
            pbt-soak/plan.txt
            pbt-soak/results.tsv
            pbt-soak/fails.log
            pbt-soak/fails/
          if-no-files-found: warn
